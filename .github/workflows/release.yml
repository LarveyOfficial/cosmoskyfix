name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (leave empty to use the VERSION file)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION:-$(cat VERSION)}"
          v="${v#v}"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "::error::Release v$v already exists. Bump VERSION or pass a new version."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./build.sh "${{ steps.version.outputs.version }}"

      # Runs before the GitHub release so a failed upload can simply be re-run.
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: yjmmRgLv
          COSMONAUTICS_PROJECT: micg1iTH
          VERSION: ${{ steps.version.outputs.version }}
          UA: LarveyOfficial/cosmoskyfix (GitHub Actions)
        run: |
          existing=$(curl -fsS -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: $UA" \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT/version" \
            | jq --arg v "$VERSION" '[.[] | select(.version_number == $v)] | length')
          if [ "$existing" != "0" ]; then
            echo "Version $VERSION already exists on Modrinth, skipping upload."
            exit 0
          fi

          jq -n \
            --arg project "$MODRINTH_PROJECT" \
            --arg dep "$COSMONAUTICS_PROJECT" \
            --arg v "$VERSION" \
            --arg changelog "See https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION" \
            '{
              project_id: $project,
              name: "Cosmonautics Sky Fix \($v)",
              version_number: $v,
              changelog: $changelog,
              version_type: "release",
              loaders: ["neoforge"],
              game_versions: ["1.21.1"],
              dependencies: [{project_id: $dep, dependency_type: "optional"}],
              featured: true,
              file_parts: ["file"],
              primary_file: "file"
            }' > modrinth.json

          curl -fsS -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: $UA" \
            -F "data=@modrinth.json;type=application/json" \
            -F "file=@build/cosmoskyfix-$VERSION.jar;type=application/java-archive" \
            | jq '{id, version_number}'

      - name: Publish release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/cosmoskyfix-$VERSION.jar" \
            --target "$GITHUB_SHA" \
            --title "Cosmonautics Sky Fix $VERSION" \
            --generate-notes
